[package]
name = "komodo-mcp"
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
description = "A Model Context Protocol server for Komodo"
repository = "https://github.com/enthouan/komodo-mcp"
license = "GPL-3.0-or-later"

[features]
distribution = ["dep:openssl"]

[dependencies]
aho-corasick = "1"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http-body-util = "0.1"
komodo_client = { version = "=2.3.2", default-features = false }
openssl = { version = "0.10", optional = true, features = ["vendored"] }
reqwest = { version = "0.13.4", default-features = false }
rmcp = { version = "=3.11.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["json"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
croner = "=3.0.1"
english-to-cron = "=0.1.7"
rmcp = { version = "=3.11.0", default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1", features = ["io-util", "net", "process", "signal", "sync", "time"] }

# Strict stdio tests keep a five-second handshake deadline even for the bounded
# megabyte escaped-credential automaton. Avoid measuring its unoptimized build
# machinery; production release builds already optimize this dependency.
[profile.dev.package.aho-corasick]
opt-level = 1
