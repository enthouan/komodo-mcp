[package]
name = "komodo-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A Model Context Protocol server for Komodo"
repository = "https://github.com/enthouan/komodo-mcp"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
