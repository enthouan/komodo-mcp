[package]
name = "komodo-mcp"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
description = "A Model Context Protocol server for Komodo"
repository = "https://github.com/enthouan/komodo-mcp"
license = "GPL-3.0-or-later"

[dependencies]
aho-corasick = "1"
anyhow = "1"
komodo_client = { version = "=2.3.2", default-features = false }
reqwest = { version = "0.13.4", default-features = false }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io", "macros"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
croner = "=3.0.1"
english-to-cron = "=0.1.7"
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw"] }
tokio = { version = "1", features = ["io-util", "net", "process", "signal", "sync", "time"] }
