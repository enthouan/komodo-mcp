# JavaScript tooling exists only for the static website under website/.
# The Rust MCP server never depends on Node or these packages.
packages:
  - website
# Allow updates to replace patched versions; browser checks validate the replacement.
allowUnusedPatches: true
# Keep the search button name aligned with its visible label and shortcut.
patchedDependencies:
  "@astrojs/starlight@0.43.1": patches/@astrojs__starlight@0.43.1.patch
