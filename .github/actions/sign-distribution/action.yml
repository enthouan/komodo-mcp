name: Sign tested distribution evidence
description: Sign a prepared SLSA statement with the main workflow identity and retain its bundle.
inputs:
  scope:
    description: Distribution name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: evidence-input-${{ inputs.scope }}-${{ github.sha }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/evidence
    - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      with:
        cosign-release: v3.1.6
    - name: Sign and verify this run's statement
      shell: bash
      working-directory: ${{ runner.temp }}/evidence
      env:
        SCOPE: ${{ inputs.scope }}
        GH_TOKEN: ${{ github.token }}
      run: |
        bundle="$SCOPE.provenance.sigstore.json"
        cosign attest-blob --yes --statement statement.json --bundle "$bundle"
        gh attestation verify "$SCOPE.sbom.cdx.json" --bundle "$bundle" --repo "$GITHUB_REPOSITORY" \
          --cert-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" --source-ref refs/heads/main \
          --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" --deny-self-hosted-runners
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: komodo-mcp-evidence-${{ inputs.scope }}-${{ github.sha }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/evidence/*.sbom.cdx.json
          ${{ runner.temp }}/evidence/*.provenance.sigstore.json
        if-no-files-found: error
        retention-days: 30
