name: Native distribution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      linux_only:
        type: boolean
        default: false

permissions:
  contents: read

env:
  REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_BUILD_JOBS: 2
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.identity.outputs.version }}
      matrix: ${{ steps.identity.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - id: identity
        env:
          LINUX_ONLY: ${{ inputs.linux_only || false }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          with open("Cargo.toml","rb") as f:
              version = tomllib.load(f)["package"]["version"]
          targets = {
              "x86_64-unknown-linux-musl": "ubuntu-24.04",
              "aarch64-unknown-linux-musl": "ubuntu-24.04-arm",
              "x86_64-apple-darwin": "macos-15-intel",
              "aarch64-apple-darwin": "macos-15",
          }
          matrix = {"include":[{"target":t,"runner":r} for t,r in targets.items()
                               if os.environ["LINUX_ONLY"] != "true" or t.endswith("-musl")]}
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              print("version="+version,file=f)
              print("matrix="+json.dumps(matrix),file=f)
          PY
      - name: Archive exact project, vendored dependencies, runtime sources and licenses
        run: python3 scripts/distribution_prepare.py source --revision "$REVISION" --output "$RUNNER_TEMP/distribution-source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-source-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution-source
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native:
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Install native musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake ninja-build perl binutils
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-source-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download
      - name: Rebuild offline from matching source and exercise the extracted binary
        run: |
          name="komodo-mcp-v$VERSION-source"
          python3 scripts/distribution_prepare.py extract-source --version "$VERSION" --archive "$RUNNER_TEMP/download/$name.tar.gz" --destination "$RUNNER_TEMP/rebuild"
          python3 "$RUNNER_TEMP/rebuild/$name/scripts/distribution_build.py" --source "$RUNNER_TEMP/rebuild/$name" --target "$TARGET" --revision "$REVISION" --output "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-native-${{ matrix.target }}-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    needs: [source, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.source.outputs.version }}
      LINUX_ONLY: ${{ inputs.linux_only || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: distribution-source-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: distribution-native-*-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - name: Verify complete native candidate and its checksum manifest
        run: |
          mode=()
          if [[ "$LINUX_ONLY" == "true" ]]; then mode+=(--linux-only); fi
          python3 scripts/distribution_prepare.py assemble --source "$RUNNER_TEMP/source" --native "$RUNNER_TEMP/native" --output "$RUNNER_TEMP/bundle" --revision "$REVISION" --version "$VERSION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" "${mode[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: komodo-mcp-distribution-${{ env.REVISION }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30
