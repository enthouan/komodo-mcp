name: Native distribution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_BUILD_JOBS: 2
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - id: identity
        run: |
          python3 - <<'PYCODE'
          import os, tomllib
          with open("Cargo.toml", "rb") as f:
              version = tomllib.load(f)["package"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              print("version="+version, file=f)
          PYCODE
      - name: Archive exact project, vendored dependencies, runtime sources and licenses
        run: python3 scripts/distribution_prepare.py source --revision "$REVISION" --output "$RUNNER_TEMP/distribution-source"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-source-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/distribution-source
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: Install native musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools cmake ninja-build perl binutils
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-source-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/download
      - name: Rebuild offline from matching source and exercise the extracted binary
        run: |
          name="komodo-mcp-v$VERSION-source"
          python3 scripts/distribution_prepare.py extract-source --version "$VERSION" --archive "$RUNNER_TEMP/download/$name.tar.gz" --destination "$RUNNER_TEMP/rebuild"
          python3 "$RUNNER_TEMP/rebuild/$name/scripts/distribution_build.py" --source "$RUNNER_TEMP/rebuild/$name" --source-archive "$RUNNER_TEMP/download/$name.tar.gz" --target "$TARGET" --revision "$REVISION" --output "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-native-${{ matrix.target }}-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    needs: [source, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: distribution-source-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: distribution-native-*-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native
          merge-multiple: true
      - name: Verify complete native candidate and its checksum manifest
        run: |
          python3 scripts/distribution_prepare.py assemble --source "$RUNNER_TEMP/source" --native "$RUNNER_TEMP/native" --output "$RUNNER_TEMP/bundle" --revision "$REVISION" --version "$VERSION" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Generate the build inventory and provenance subjects
        run: |
          python3 scripts/stable_evidence.py prepare --scope native --native "$RUNNER_TEMP/bundle" \
            --output "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-input-native-${{ env.REVISION }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: komodo-mcp-distribution-${{ env.REVISION }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 30

  attest:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/sign-distribution
        with:
          scope: native
