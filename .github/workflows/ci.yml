name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The expanded stdio suite and optimized builds used 28m33s in #118.
    timeout-minutes: 45
    env:
      # Debug symbols across the stdio binaries exhaust hosted runner disk.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Test release metadata, publication and recovery without network writes
        run: python3 -m unittest discover -s scripts -v
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --bin komodo-mcp
      - run: cargo build --locked --examples
      - name: Run the documented fresh stdio demonstration
        run: cargo run --locked --example stacks_on_server -- ./target/release/komodo-mcp
      - name: Verify release metadata and the actual executable's MCP version
        run: |
          release_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          python3 scripts/release.py metadata --version "$release_version"
          cargo run --locked --example release_version -- ./target/release/komodo-mcp "$release_version"
      - name: Verify a scenario failure exits nonzero after cleanup
        run: |
          if cargo run --locked --example stacks_on_server -- ./target/release/komodo-mcp missing-server > target/demo-failure.log 2>&1; then
            cat target/demo-failure.log
            exit 1
          fi
          cat target/demo-failure.log
          grep -qF 'mock stopped' target/demo-failure.log
